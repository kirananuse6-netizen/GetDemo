<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>form 3</title>
</head>
<body>
    <h2>Form Tag </h2>
<form>
    <label>Enter Roll no</label>
    <input type="text"name="Roll no"><br>
    <label>Enter Name</label>
    <input type="text" name="name"value="RCSC" readonly><br>
    <label>Enter address</label>
    <textarea name="address"disable>address here</textarea><br>
    <label>select gender</label>
    <input type="radio" name="gender"value="male">male
    <input type="radio" name="gender"value="female"checked>female<br>
    <label>Select language</label>
    <input type="checkbox"name="language"value="c">c
    <input type="checkbox"name="language"value="cpp">cpp
    <input type="checkbox"name="language"value="java">java
    <input type="checkbox"name="language"value="python">python<br>
    <label>Select department</label>
    <select name="deparment">
        <option value="0">0 selected</option>
        <option value="1">deparment1</option>
        <option value="2">department2</option>
    </select>
    <br><br>
    <button type="submit">save</button>
</form>
</body>
</html>
